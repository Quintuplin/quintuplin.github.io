name: Site

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    # The Actions budget allows under 2 minutes per run, so a slower run fails visibly (#46).
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check built site
        run: sh scripts/check_site.sh _site
